name: CI

on:
  push:
    tags: ['v*']
    branches: ['**']
  pull_request:

jobs:
  build-and-test:
    name: Build+Test (${{ matrix.platform.os }}-${{ matrix.platform.target }}, polars ${{ matrix.polars-version }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.platform.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        platform:
          - {os: ubuntu-latest,  target: x86_64,               qemu: false}
          - {os: ubuntu-latest,  target: aarch64,               qemu: true}
          - {os: macos-latest,   target: aarch64-apple-darwin,  qemu: false}
          - {os: windows-latest, target: x86_64-pc-windows-msvc, qemu: false}
        python-version: ["3.12", "3.13", "3.14"]
        polars-version:
          - "1.38.1"
          - "1.39.2"
          - "1.39.3"
          - "1.40.1"
          - "1.41.1"
          - "1.41.2"
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        if: matrix.platform.qemu
        uses: docker/setup-qemu-action@v3

      - name: Configure for polars ${{ matrix.polars-version }}
        run: python3 ci/configure.py ${{ matrix.polars-version }}

      - name: Read toolchain
        id: toolchain
        shell: bash
        run: echo "channel=$(grep channel rust-toolchain.toml | sed "s/.*= *\"\(.*\)\"/\1/")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist -i python${{ matrix.python-version }}
          sccache: ${{ !matrix.platform.qemu }}
          manylinux: auto
          rust-toolchain: ${{ steps.toolchain.outputs.channel }}

      - name: Test (native)
        if: "!matrix.platform.qemu"
        shell: bash
        run: |
          pip install "polars==${{ matrix.polars-version }}" pytest
          pip install --find-links dist/ rtlf --force-reinstall --no-index
          pytest tests/ -v

      - name: Test (aarch64 via QEMU)
        if: matrix.platform.qemu
        run: |
          docker run --rm --platform linux/arm64 \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            python:${{ matrix.python-version }}-slim \
            bash -c "pip install 'polars==${{ matrix.polars-version }}' pytest && pip install --find-links /work/dist/ rtlf --no-index && pytest tests/ -v"

      # Only reached if tests pass
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.os }}-${{ matrix.platform.target }}-polars${{ matrix.polars-version }}-py${{ matrix.python-version }}
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
