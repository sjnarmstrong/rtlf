name: CI

on:
  push:
    tags: ['v*']
    branches: ['**']
  pull_request:

jobs:
  # -----------------------------------------------------------------------
  # Native targets: build one wheel per (polars x python x platform),
  # test it, upload only if tests pass.
  # -----------------------------------------------------------------------
  build-and-test:
    name: Build+Test (${{ matrix.polars-version }}, py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        polars-version:
          - "1.38.1"
          - "1.39.2"
          - "1.39.3"
          - "1.40.1"
          - "1.41.1"
          - "1.41.2"
        include:
          - os: ubuntu-latest
            target: x86_64
            manylinux: auto
          - os: macos-latest
            target: aarch64-apple-darwin
            manylinux: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: ""
    steps:
      - uses: actions/checkout@v4

      - name: Configure for polars ${{ matrix.polars-version }}
        run: python3 ci/configure.py ${{ matrix.polars-version }}

      - name: Read toolchain
        id: toolchain
        shell: bash
        run: echo "channel=$(grep channel rust-toolchain.toml | sed "s/.*= *\"\(.*\)\"/\1/")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist -i python${{ matrix.python-version }}
          sccache: true
          manylinux: ${{ matrix.manylinux }}
          rust-toolchain: ${{ steps.toolchain.outputs.channel }}
        env:
          CFLAGS_aarch64_unknown_linux_gnu: "-march=armv8-a"

      - name: Test
        shell: bash
        run: |
          pip install "polars==${{ matrix.polars-version }}" pytest
          pip install --find-links dist/ rtlf --force-reinstall --no-index
          pytest tests/ -v

      # Only reached if tests pass
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}-polars${{ matrix.polars-version }}-py${{ matrix.python-version }}
          path: dist/

  # -----------------------------------------------------------------------
  # Linux aarch64: cross-compiled, can't test natively.
  # -----------------------------------------------------------------------
  build-linux-aarch64:
    name: Build (linux aarch64, polars ${{ matrix.polars-version }})
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        polars-version:
          - "1.38.1"
          - "1.39.2"
          - "1.39.3"
          - "1.40.1"
          - "1.41.1"
          - "1.41.2"
    steps:
      - uses: actions/checkout@v4

      - name: Configure for polars ${{ matrix.polars-version }}
        run: python3 ci/configure.py ${{ matrix.polars-version }}

      - name: Read toolchain
        id: toolchain
        run: echo "channel=$(grep channel rust-toolchain.toml | sed "s/.*= *\"\(.*\)\"/\1/")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: PyO3/maturin-action@v1
        with:
          target: aarch64
          args: --release --out dist -i 3.12 3.13 3.14
          sccache: true
          manylinux: auto
          rust-toolchain: ${{ steps.toolchain.outputs.channel }}
        env:
          CFLAGS_aarch64_unknown_linux_gnu: "-march=armv8-a"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-aarch64-polars${{ matrix.polars-version }}
          path: dist/

  # -----------------------------------------------------------------------
  # Publish everything that was uploaded. skip-existing is safe to re-run.
  # -----------------------------------------------------------------------
  publish:
    name: Publish to PyPI
    needs: [build-and-test, build-linux-aarch64]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
